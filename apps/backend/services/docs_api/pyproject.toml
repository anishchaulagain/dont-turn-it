[project]
name = "docs-api"
version = "0.1.0"
description = "Document service: upload, analyse, rewrite, before/after scores, download"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "platform-core",
    "docmodel",
    "detection",
    "rewriting",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
platform-core = { workspace = true }
docmodel = { workspace = true }
detection = { workspace = true }
rewriting = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
