[project]
name = "docmodel"
version = "0.1.0"
description = "Document IR: parsing (TXT/MD/DOCX), segmentation, protected spans, lossless export"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "python-docx>=1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
