[project]
name = "verification"
version = "0.1.0"
description = "Knowledge-preservation gates for rewrites (placeholders, numbers, entities, polarity, length)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "docmodel",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
docmodel = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
