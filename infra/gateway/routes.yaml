# AI Gateway routing table.
#
# deployments: one model on one provider. The key must equal a `model_name` in
#              infra/litellm/config.yaml. `requires_env` skips the deployment when
#              that API key is unset, so the platform works with zero keys (Ollama only).
#              `rpm` is the free-tier requests-per-minute; the gateway stops sending
#              to a deployment once its budget for the minute is spent.
# aliases:     what callers ask for. Deployments are tried in order; on failure,
#              rate limit, missing key or an open circuit breaker, the next one is used.
#
# Free-tier model IDs change often; check provider docs if a deployment 404s.

deployments:
  # Catalogues checked against each provider's /models endpoint on 2026-10-19.
  # ---- Groq (free tier) ----
  groq-gpt-oss-20b:
    provider: groq
    rpm: 30
    context_window: 131072
    requires_env: GROQ_API_KEY
  groq-gpt-oss-120b:
    provider: groq
    rpm: 30
    context_window: 131072
    requires_env: GROQ_API_KEY
  groq-qwen3-27b:
    # Different family from the gpt-oss judge, so it can serve rewrites.
    provider: groq
    rpm: 30
    context_window: 131072
    requires_env: GROQ_API_KEY

  # ---- Google Gemini (free tier; never used for document text) ----
  gemini-2.5-flash:
    provider: gemini
    rpm: 10
    context_window: 1048576
    requires_env: GEMINI_API_KEY
  gemini-2.5-flash-lite:
    provider: gemini
    rpm: 15
    context_window: 1048576
    requires_env: GEMINI_API_KEY

  # ---- OpenRouter (:free models) ----
  openrouter-gemma-4-31b:
    provider: openrouter
    rpm: 20
    context_window: 131072
    requires_env: OPENROUTER_API_KEY
  openrouter-nemotron-3-super:
    provider: openrouter
    rpm: 20
    context_window: 131072
    requires_env: OPENROUTER_API_KEY

  # ---- Mistral (La Plateforme; free "Experiment" tier is roughly 1 request/s) ----
  mistral-small:
    provider: mistral
    rpm: 50
    context_window: 131072
    requires_env: MISTRAL_API_KEY
  mistral-medium:
    provider: mistral
    rpm: 50
    context_window: 131072
    requires_env: MISTRAL_API_KEY
  mistral-embed:
    provider: mistral
    kind: embedding
    rpm: 50
    requires_env: MISTRAL_API_KEY

  # ---- Ollama (local, no key, no rate limit) ----
  ollama-qwen2.5-7b:
    provider: ollama
    context_window: 32768
  ollama-mistral-7b:
    provider: ollama
    context_window: 32768
  ollama-nomic-embed:
    provider: ollama
    kind: embedding

aliases:
  chat-fast:
    description: Low-latency general chat
    deployments: [groq-gpt-oss-20b, gemini-2.5-flash-lite, openrouter-gemma-4-31b, ollama-qwen2.5-7b]
  chat-smart:
    description: Harder questions, longer context
    deployments: [gemini-2.5-flash, groq-gpt-oss-120b, openrouter-nemotron-3-super, ollama-qwen2.5-7b]
  extract:
    description: Metadata / entity extraction (JSON)
    deployments: [ollama-qwen2.5-7b, groq-gpt-oss-20b, gemini-2.5-flash-lite]
  summarize:
    description: History compression
    deployments: [ollama-qwen2.5-7b, groq-gpt-oss-20b, gemini-2.5-flash-lite]
  judge:
    # Different model families from the chat answerers where possible, to reduce self-bias.
    description: LLM-as-judge for evaluations
    deployments: [gemini-2.5-flash, openrouter-gemma-4-31b, ollama-mistral-7b]
  # ---- Document aliases (docs/PLAN.md §8A.3, §9.2) ----
  # They carry user document text, so:
  #   - no Gemini free tier (prompts may be used for training / human review)
  #   - cache "exact" only: a semantic hit would return another paragraph's rewrite
  #   - PII redaction off (it would change the document); injection guard flags only
  # Enable Zero Data Retention in the Groq console and "no training" providers in
  # OpenRouter privacy settings before sending real documents.
  rewrite:
    description: Style-only paragraph rewriting with meaning preserved
    # Fallbacks stay outside the gpt-oss family so the nli-judge never grades its own output.
    deployments: [mistral-small, mistral-medium, groq-qwen3-27b, openrouter-gemma-4-31b, openrouter-nemotron-3-super, ollama-qwen2.5-7b]
    cache: exact
    redact_pii: false
    injection_mode: flag
  nli-judge:
    # Entailment checks for gate G5. Deliberately a different model family from
    # the rewriter (OpenAI gpt-oss first, Mistral as fallback) to reduce self-agreement bias.
    description: Does passage A entail sentence B? (JSON)
    deployments: [groq-gpt-oss-120b, mistral-medium, mistral-small, ollama-qwen2.5-7b]
    cache: exact
    redact_pii: false
    injection_mode: flag
  claim-extract:
    description: Atomic claims / paragraph roles / narrative events (JSON)
    deployments: [groq-gpt-oss-20b, mistral-small, openrouter-gemma-4-31b, ollama-qwen2.5-7b]
    cache: exact
    redact_pii: false
    injection_mode: flag
  embed-semantic:
    # 1024-d; used for the S1 similarity check and style-exemplar retrieval.
    kind: embedding
    description: Mistral embeddings
    deployments: [mistral-embed]
  embed:
    # All deployments of an embedding alias must produce the same vector size.
    kind: embedding
    description: Text embeddings (768-d)
    deployments: [ollama-nomic-embed]
